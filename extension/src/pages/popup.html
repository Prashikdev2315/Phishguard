<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'self'; base-uri 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhishGuard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { width: 360px; min-height: 520px; margin: 0; padding: 22px; box-sizing: border-box; color: #172033; background: #f8fafc; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.15rem; margin: 0; } h2 { font-size: 1rem; margin: 16px 0 6px; }
    .card { margin-top: 18px; padding: 18px; background: white; border: 1px solid #dbe3ef; border-radius: 14px; box-shadow: 0 3px 14px #17203312; }
    .state { display: flex; align-items: center; gap: 10px; font-weight: 700; } .icon { font-size: 1.8rem; }
    .safe { color: #047857; } .suspicious { color: #a16207; } .high-risk { color: #b91c1c; } .error { color: #475569; }
    .host { font-family: ui-monospace, monospace; overflow-wrap: anywhere; margin: 12px 0; }
    .muted { color: #64748b; font-size: .82rem; } .reason { margin: 5px 0; }
    progress { width: 100%; height: 12px; accent-color: #10b981; } .score { font-size: 2rem; font-weight: 800; }
    button, a { font: inherit; } button { border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; } .primary { background: #0f766e; color: white; }
    .secondary { background: #e2e8f0; color: #172033; } button:disabled { cursor: not-allowed; opacity: .55; }
    #toast { min-height: 1.2em; color: #047857; font-size: .82rem; margin-top: 8px; }
  </style>
</head>
<body>
  <header><h1>PhishGuard</h1><a href="../pages/options.html" id="settings">Settings</a></header>
  <main class="card" aria-live="polite">
    <div id="state" class="state error"><span id="icon" class="icon" aria-hidden="true">◌</span><span id="state-label">Loading</span></div>
    <div id="host" class="host">Checking this tab…</div>
    <div><span id="score" class="score">—</span><span class="muted"> / 100 risk</span></div>
    <progress id="risk-meter" max="100" value="0" aria-label="Risk score"></progress>
    <h2>Why this result?</h2>
    <ul id="reasons"><li class="muted">Waiting for the scan.</li></ul>
    <div class="actions"><button id="trust" class="primary" type="button">Trust this site</button><button id="copy" class="secondary" type="button">Copy report</button></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="../../dist/pages/popup.js"></script>
</body>
</html>
