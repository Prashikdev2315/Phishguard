<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'self'; base-uri 'self'"><title>PhishGuard warning</title>
<style>body{font-family:system-ui,sans-serif;max-width:700px;margin:0 auto;padding:32px;color:#172033;background:#fff7f7}header{background:#b91c1c;color:white;padding:18px;border-radius:12px}#host-display{font-family:ui-monospace,monospace;font-weight:700;overflow-wrap:anywhere}button{padding:10px 14px;border:0;border-radius:7px;cursor:pointer;margin-right:8px}#btn-back{background:#b91c1c;color:white}#btn-proceed{background:#e2e8f0}.danger{color:#991b1b}.hidden{display:none}li{margin:8px 0}</style></head>
<body><header role="alert"><h1>⚠ Deceptive site blocked</h1><p>PhishGuard thinks this address may be trying to steal information.</p></header>
<main><p id="failure" class="hidden danger">PhishGuard could not verify the security of this site.</p><p id="host-display">Loading destination…</p><ul id="reasons"></ul>
<button id="btn-back" type="button">Go back to safety</button><button id="btn-proceed-toggle" type="button" aria-expanded="false">Advanced / Show options</button>
<section id="proceed-section" class="hidden"><label><input type="checkbox" id="risk-check"> I understand this site may steal my information</label><button id="btn-proceed" type="button" disabled>Proceed anyway</button></section></main>
<script src="../../dist/pages/warning.js"></script></body></html>
